[package]
name = "comp-cli"
description = "Command-line front-end for anime-comp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "comp"
path = "src/main.rs"

[dependencies]
comp-core = { path = "../comp-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
