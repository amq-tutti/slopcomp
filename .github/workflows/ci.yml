name: CI

# Only code and build inputs trigger CI (README, docs and changelog edits don't); the Actions tab
# can still start a run by hand.
on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "deps/**"
      - "testdata/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "deps/**"
      - "testdata/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            shell: bash
          - name: Linux x64
            os: ubuntu-24.04
            shell: bash
          - name: Windows x64 (MSYS2 UCRT64)
            os: windows-2022
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- toolchains
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool meson ninja nasm pkg-config ffmpeg

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool meson ninja-build nasm \
            pkg-config zlib1g-dev libclang-dev ffmpeg

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make autoconf automake libtool diffutils tar
          pacboy: >-
            toolchain:p meson:p ninja:p nasm:p pkgconf:p zlib:p clang:p rust:p ffmpeg:p

      - name: Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------------- native deps
      # Restore and save are separate steps so the deps are cached as soon as they're built, even
      # if a later step (tests) fails. The release workflow uses the same key, so tag builds reuse
      # this cache from master.
      - name: Restore native deps
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/prefix
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build.sh') }}

      - name: Build native deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: deps/build.sh

      - name: Save native deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/prefix
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # ---------------------------------------------------------------- build + test
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The corpus is random (test patterns with random seeds), so it's generated once per
      # make_corpus.sh version and reused: faster, and the same clips from run to run.
      - name: Restore test corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: testdata/corpus
          key: corpus-${{ runner.os }}-${{ hashFiles('testdata/make_corpus.sh') }}

      - name: Generate test corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: testdata/make_corpus.sh

      - name: Save test corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: testdata/corpus
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Build
        run: cargo build --workspace --release

      # --no-fail-fast: run every test binary even after one fails, so a run shows all failures.
      - name: Test (frame accuracy, colour conversion)
        run: cargo test --workspace --release --no-fail-fast

      - name: CLI smoke test
        run: |
          ./target/release/comp info testdata/corpus/dvd_mpeg2.mpg
          ./target/release/comp shot testdata/corpus/hevc_10bit.mkv 0 100 239 -o shots
          ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ runner.os }}
          path: shots/
